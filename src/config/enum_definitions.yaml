  LSS_USE_CASE_DASHED_LINE: 1      # Use case for dashed line support
  LSS_USE_CASE_SOLID_LINE: 2       # Use case for solid line support
  LSS_USE_CASE_ROAD_EDGE: 3        # Use case for road edge support
  LSS_USE_CASE_OVERTAKING: 4       # Use case for overtaking support
  LSS_USE_CASE_ONCOMING: 5         # Use case for oncoming traffic support
  LSS_USE_CASE_STATIONARY: 6       # Stationary object support (deprecated; included in OVERTAKING)
