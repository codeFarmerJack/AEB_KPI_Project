# --- Explicit MDF signal ↔ enum mapping ---

SignalToEnumMap:
  aebRequest: AutoEmergencyBrakingRequestType
  fcwRequest: ForwardCollisionWarningRequestType
  isVehicleStoppedNV: VioVehicleStopped
  aebFullState: AutoEmergencyBrakingPlannerState
  aebPartialState: AutoEmergencyBrakingPlannerState
  cpmEventType: DIActiveSafetyCPMEvent
  lkaInterventionStatus: DIActiveSafetyEvent
  useCase: LssUseCase
  cpmRunSetting: DIActiveSafetyRunSettings
  aebRunSetting: DIActiveSafetyRunSettings
  fcwRunSetting: DIActiveSafetyRunSettings
  dbsRunSetting: DIActiveSafetyRunSettings

# Enums used to convert symbolic MDF signal values into numeric codes.

ForwardCollisionWarningRequestType:
  FORWARD_COLLISION_WARNING_REQUEST_NONE: 0    # no activation
  FORWARD_COLLISION_WARNING_REQUEST_LEVEL_1: 1 # level 1 warning (pre FCW)
  FORWARD_COLLISION_WARNING_REQUEST_LEVEL_2: 2 # level 2 warning (FCW)
  FORWARD_COLLISION_WARNING_REQUEST_LEVEL_3: 3 # level 3 warning (FCW + haptical)

AutoEmergencyBrakingRequestType:
  AUTO_EMERGENCY_BRAKING_REQUEST_NONE: 0       # no type
  AUTO_EMERGENCY_BRAKING_REQUEST_PARTIAL: 1    # partial braking
  AUTO_EMERGENCY_BRAKING_REQUEST_FULL: 2       # full braking
  AUTO_EMERGENCY_BRAKING_REQUEST_HOLD: 3       # hold ego stopped
  AUTO_EMERGENCY_BRAKING_REQUEST_FCW: 5        # FCW testing
  AUTO_EMERGENCY_BRAKING_REQUEST_LIMITING: 6   # limiting acceleration

VioVehicleStopped:
  VIO_VEHICLE_STOPPED_UNKNOWN: 0  # Schroedinger’s vehicle motion
  VIO_VEHICLE_STOPPED_FALSE: 1    # vehicle moving
  VIO_VEHICLE_STOPPED_TRUE: 2     # vehicle not moving

AutoEmergencyBrakingPlannerState:
  AUTO_EMERGENCY_BRAKING_PLANNER_STATE_UNSPECIFIED: 0
  AUTO_EMERGENCY_BRAKING_PLANNER_STATE_READY: 1
  AUTO_EMERGENCY_BRAKING_PLANNER_STATE_ACTIVE: 2
  AUTO_EMERGENCY_BRAKING_PLANNER_STATE_HOLD: 3
  AUTO_EMERGENCY_BRAKING_PLANNER_STATE_UNAVAILABLE: 4
  AUTO_EMERGENCY_BRAKING_PLANNER_STATE_DEGRADED: 5

DIActiveSafetyCPMEvent:
  DI_ACTIVE_SAFETY_EVENT_CPM_NONE: 0       # No event is active
  DI_ACTIVE_SAFETY_EVENT_CPM_COMFORT: 1    # Comfort event is active
  DI_ACTIVE_SAFETY_EVENT_CPM_CRITICAL: 2   # Critical event is active
  DI_ACTIVE_SAFETY_EVENT_CPM_DAA: 3        # Drive Away Assist event is active
  DI_ACTIVE_SAFETY_EVENT_CPM_ACPE: 4       # Acceleration Control for Pedal Error event is active

DIActiveSafetyEvent:
  DI_ACTIVE_SAFETY_EVENT_NONE: 0       # No active warning or event
  DI_ACTIVE_SAFETY_EVENT_LEVEL_1: 1    # Level 1 warning or event is active
  DI_ACTIVE_SAFETY_EVENT_LEVEL_2: 2    # Level 2 warning or event is active
  DI_ACTIVE_SAFETY_EVENT_LEVEL_3: 3    # Level 3 warning or event is active
  DI_ACTIVE_SAFETY_EVENT_LEVEL_4: 4    # Level 4 warning or event is active
  DI_ACTIVE_SAFETY_EVENT_COUNT: 5      # Total number of defined event levels

DIActiveSafetyRunSettings:
  DI_ACTIVE_SAFETY_RUN_SETTINGS_INVALID: 0      # upstream not set
  DI_ACTIVE_SAFETY_RUN_SETTINGS_DONT_RUN: 1     # feature off
  DI_ACTIVE_SAFETY_RUN_SETTINGS_ENABLED: 2      # feature on / monitoring
  DI_ACTIVE_SAFETY_RUN_SETTINGS_EXTERNALLY_FAULTED: 3  # faulted state command
  DI_ACTIVE_SAFETY_RUN_SETTINGS_COUNT: 4        # number of values

LssUseCase:
  LSS_USE_CASE_UNSPECIFIED: 0      # Unspecified use case
  LSS_USE_CASE_DASHED_LINE: 1      # Use case for dashed line support
  LSS_USE_CASE_SOLID_LINE: 2       # Use case for solid line support
  LSS_USE_CASE_ROAD_EDGE: 3        # Use case for road edge support
  LSS_USE_CASE_OVERTAKING: 4       # Use case for overtaking support
  LSS_USE_CASE_ONCOMING: 5         # Use case for oncoming traffic support
  LSS_USE_CASE_STATIONARY: 6       # Stationary object support (deprecated; included in OVERTAKING)
